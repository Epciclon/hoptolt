name: Pipeline de Integración Continua

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-checks:
    name: Validación de Arquitectura e Integridad
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar arquitectura de carpetas, capas y cobertura modular
        run: node scripts/validate-architecture.js

  backend-checks:
    name: Revisión del Backend
    needs: architecture-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis del punto de entrada
        run: node --check src/app.js

      - name: Ejecutar Pruebas Unitarias e Integración con Cobertura
        run: npm run test:coverage

      - name: Guardar Reporte de Cobertura Backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-backend
          path: backend/coverage/
          retention-days: 10

  frontend-checks:
    name: Revisión del Frontend
    needs: architecture-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter
        run: npm run lint

      - name: Revisar Tipado TypeScript
        run: npx tsc --noEmit

      - name: Ejecutar Pruebas Unitarias Vitest
        run: npm run test

      - name: Compilar App Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://fake.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "fake_anon_key"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "fake_pub_key"

      - name: Instalar Navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Pruebas E2E Playwright
        run: npm run test:e2e

      - name: Guardar Reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: frontend/playwright-report/
          retention-days: 10
