name: Pipeline de Integración Continua

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-checks:
    name: Validación de Arquitectura e Integridad
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar arquitectura de carpetas, capas, fronteras y seguridad modular
        run: node scripts/validate-architecture.js

      - name: Auditoría de Seguridad de Dependencias (npm audit)
        run: |
          npm --prefix backend audit --audit-level=critical || true
          npm --prefix frontend audit --audit-level=critical || true

  backend-checks:
    name: Revisión del Backend
    needs: architecture-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Pruebas Unitarias e Integración con Cobertura
        run: npm run test:coverage

      - name: Guardar Reporte de Cobertura Backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-backend
          path: backend/coverage/
          retention-days: 10

  frontend-checks:
    name: Revisión del Frontend
    needs: architecture-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter
        run: npm run lint

      - name: Revisar Tipado TypeScript
        run: npx tsc --noEmit

      - name: Ejecutar Pruebas Unitarias Vitest
        run: npm run test

      - name: Compilar App Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "fake_anon_key"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJmYWtlIjoiZmFrZSJ9.fake"
          NEXT_PUBLIC_E2E_BYPASS: "true"
          E2E_BYPASS_ENABLED: "true"

      - name: Obtener versión de Playwright
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache de binarios de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Instalar Navegadores de Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Pruebas E2E Playwright
        run: npm run test:e2e
        env:
          CI: true
          E2E_BYPASS_ENABLED: "true"
          NEXT_PUBLIC_E2E_BYPASS: "true"

      - name: Guardar Reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: frontend/playwright-report/
          retention-days: 10
